server:
  port: 8080
spring:
  application:
    name: eia-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ["http://localhost:3000", "http://127.0.0.1:3000"]
            allowedMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: party
          uri: http://localhost:8082
          predicates: [Path=/api/v1/parties/**]
        - id: policy
          uri: http://localhost:8084
          predicates: [Path=/api/v1/policies/**]
        - id: contract
          uri: http://localhost:8086
          predicates: [Path=/api/v1/contracts/**]
        - id: direct-claims
          uri: http://localhost:8088
          predicates: [Path=/api/v1/claims/**]
        - id: assumed-claims
          uri: http://localhost:8090
          predicates: [Path=/api/v1/assumed-claims/**]
        - id: cession
          uri: http://localhost:8092
          predicates: [Path=/api/v1/cessions/**]
        - id: retrocession
          uri: http://localhost:8094
          predicates: [Path=/api/v1/retrocessions/**]
        - id: document
          uri: http://localhost:8096
          predicates: [Path=/api/v1/documents/**]
        - id: payment
          uri: http://localhost:8098
          predicates: [Path=/api/v1/payments/**]
        - id: notifications
          uri: http://localhost:8100
          predicates: [Path=/api/v1/notifications/**]
        - id: lineage
          uri: http://localhost:8101
          predicates: [Path=/api/v1/lineage/**]
        - id: event-ingest
          uri: http://localhost:8102
          predicates: [Path=/api/v1/events/**]
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
