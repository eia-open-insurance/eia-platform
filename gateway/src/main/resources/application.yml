server:
  port: 8080
eia:
  auth:
    # Opt-in edge authentication. Disabled by default: every exchange is
    # permitted, preserving the gateway's public behaviour. When enabled, only
    # /actuator/health and /api/v1/directory stay public and all other
    # exchanges require a valid bearer JWT. Authenticated /api/** exchanges
    # need SCOPE_eia.read for GET/HEAD/OPTIONS and SCOPE_eia.write for
    # POST/PUT/PATCH/DELETE; the request is bound to the JWT tenant claim
    # (X-EIA-Tenant is injected or must match) and the JWT subject is
    # forwarded as X-EIA-Actor.
    enabled: false
    jwks-uri: http://localhost:9000/oauth2/jwks
    issuer: http://localhost:9000
    tenant-claim: tenant_id
spring:
  application:
    name: eia-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ["http://localhost:3000", "http://127.0.0.1:3000"]
            allowedMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
      routes:
        - id: party
          uri: http://localhost:8082
          predicates: [Path=/api/v1/parties/**]
        - id: policy
          uri: http://localhost:8084
          predicates: [Path=/api/v1/policies/**]
        - id: policy-billing
          uri: http://localhost:8084
          predicates: [Path=/api/v1/billing/**]
        - id: policy-programs
          uri: http://localhost:8084
          predicates: [Path=/api/v1/programs/**]
        - id: policy-legal-entities
          uri: http://localhost:8084
          predicates: [Path=/api/v1/legal-entities/**]
        - id: contract
          uri: http://localhost:8086
          predicates: [Path=/api/v1/contracts/**]
        - id: direct-claims
          uri: http://localhost:8088
          predicates: [Path=/api/v1/claims/**]
        - id: assumed-claims
          uri: http://localhost:8090
          predicates: [Path=/api/v1/assumed-claims/**]
        - id: cession
          uri: http://localhost:8092
          predicates: [Path=/api/v1/cessions/**]
        - id: retrocession
          uri: http://localhost:8094
          predicates: [Path=/api/v1/retrocessions/**]
        - id: document
          uri: http://localhost:8096
          predicates: [Path=/api/v1/documents/**]
        - id: payment
          uri: http://localhost:8098
          predicates: [Path=/api/v1/payments/**]
        - id: notifications
          uri: http://localhost:8100
          predicates: [Path=/api/v1/notifications/**]
        - id: lineage
          uri: http://localhost:8101
          predicates: [Path=/api/v1/lineage/**]
        - id: event-ingest
          uri: http://localhost:8102
          predicates: [Path=/api/v1/events/**]
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
