server:
  port: 8102
spring:
  application:
    name: eia-event-ingest
  datasource:
    url: jdbc:postgresql://localhost:5432/eia_platform
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
eia:
  event-ingest:
    # Optional HMAC-SHA256 secret shared with the outbox dispatchers.
    # When blank, X-EIA-Signature is not checked (local development default).
    signing-secret: ${EIA_EVENT_SIGNING_SECRET:}
    max-recent-limit: ${EIA_EVENT_MAX_RECENT_LIMIT:200}
